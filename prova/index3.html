<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hierarchical Edge Bundling - D3.js</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 1rem;
        background: #fff;
      }

      svg {
        width: 100%;
        height: auto;
      }

      text {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Hierarchical Edge Bundling - D3.js</h2>
    <div id="chart"></div>

    <!-- D3.js v7 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
      const data = {
        name: "root",
        children: [
          {
            name: "groupA",
            children: [
              { name: "A1", imports: ["groupB.B1", "groupC.C1"] },
              { name: "A2", imports: ["groupC.C3"] },
              { name: "A3", imports: [] },
            ],
          },
          {
            name: "groupB",
            children: [
              { name: "B1", imports: ["groupC.C2", "groupA.A3"] },
              { name: "B2", imports: [] },
            ],
          },
          {
            name: "groupC",
            children: [
              { name: "C1", imports: ["groupB.B1"] },
              { name: "C2", imports: [] },
              { name: "C3", imports: ["groupA.A1"] },
            ],
          },
        ],
      };

      const colorin = "#00c853";
      const colorout = "#d50000";
      const colornone = "#ccc";

      const width = 954;
      const radius = width / 2;

      const tree = d3.cluster().size([2 * Math.PI, radius - 100]);

      const svg = d3
        .create("svg")
        .attr("width", width)
        .attr("height", width)
        .attr("viewBox", [-width / 2, -width / 2, width, width])
        .attr("style", "max-width: 100%; height: auto; font: 10px sans-serif;");

      const root = tree(
        bilink(
          d3
            .hierarchy(data)
            .sort(
              (a, b) =>
                d3.ascending(a.height, b.height) ||
                d3.ascending(a.data.name, b.data.name)
            )
        )
      );

      const node = svg
        .append("g")
        .selectAll("g")
        .data(root.leaves())
        .join("g")
        .attr(
          "transform",
          (d) => `rotate(${(d.x * 180) / Math.PI - 90}) translate(${d.y},0)`
        )
        .append("text")
        .attr("dy", "0.31em")
        .attr("x", (d) => (d.x < Math.PI ? 6 : -6))
        .attr("text-anchor", (d) => (d.x < Math.PI ? "start" : "end"))
        .attr("transform", (d) => (d.x >= Math.PI ? "rotate(180)" : null))
        .text((d) => d.data.name)
        .each(function (d) {
          d.text = this;
        })
        .on("mouseover", overed)
        .on("mouseout", outed)
        .call((text) =>
          text
            .append("title")
            .text(
              (d) =>
                `${id(d)}\n${d.outgoing.length} outgoing\n${
                  d.incoming.length
                } incoming`
            )
        );

      const line = d3
        .lineRadial()
        .curve(d3.curveBundle.beta(0.85))
        .radius((d) => d.y)
        .angle((d) => d.x);

      const link = svg
        .append("g")
        .attr("stroke", colornone)
        .attr("fill", "none")
        .selectAll("path")
        .data(root.leaves().flatMap((leaf) => leaf.outgoing))
        .join("path")
        .style("mix-blend-mode", "multiply")
        .attr("d", ([i, o]) => line(i.path(o)))
        .each(function (d) {
          d.path = this;
        });

      function overed(event, d) {
        link.style("mix-blend-mode", null);
        d3.select(this).attr("font-weight", "bold");
        d3.selectAll(d.incoming.map((d) => d.path))
          .attr("stroke", colorin)
          .raise();
        d3.selectAll(d.incoming.map(([d]) => d.text))
          .attr("fill", colorin)
          .attr("font-weight", "bold");
        d3.selectAll(d.outgoing.map((d) => d.path))
          .attr("stroke", colorout)
          .raise();
        d3.selectAll(d.outgoing.map(([, d]) => d.text))
          .attr("fill", colorout)
          .attr("font-weight", "bold");
      }

      function outed(event, d) {
        link.style("mix-blend-mode", "multiply");
        d3.select(this).attr("font-weight", null);
        d3.selectAll(d.incoming.map((d) => d.path)).attr("stroke", null);
        d3.selectAll(d.incoming.map(([d]) => d.text))
          .attr("fill", null)
          .attr("font-weight", null);
        d3.selectAll(d.outgoing.map((d) => d.path)).attr("stroke", null);
        d3.selectAll(d.outgoing.map(([, d]) => d.text))
          .attr("fill", null)
          .attr("font-weight", null);
      }

      function id(d) {
        return d
          .ancestors()
          .reverse()
          .map((d) => d.data.name)
          .join(".");
      }

      function bilink(root) {
        const map = new Map(root.leaves().map((d) => [id(d), d]));
        for (const d of root.leaves()) {
          d.incoming = [];
          d.outgoing = (d.data.imports || [])
            .map((i) => [d, map.get(i)])
            .filter(([, o]) => o); // <-- evita undefined
        }
        for (const d of root.leaves()) {
          for (const o of d.outgoing) {
            o[1].incoming.push(o);
          }
        }
        return root;
      }

      document.getElementById("chart").appendChild(svg.node());
    </script>
  </body>
</html>
